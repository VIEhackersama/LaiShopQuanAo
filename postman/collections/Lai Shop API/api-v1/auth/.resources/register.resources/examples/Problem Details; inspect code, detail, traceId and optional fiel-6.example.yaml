$kind: http-example
name: Problem Details; inspect code, detail, traceId and optional fieldErrors.
request:
  url: "{{baseUrl}}/api/v1/auth/register"
  method: POST
  headers:
    Accept: application/problem+json
  body:
    type: json
    content: |-
      {
        "email": "ja7@RrFUlXBpZEczfOJ.raxs",
        "fullName": "string",
        "password": "stringstring"
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "code": "string",
        "detail": "string",
        "status": 8553,
        "traceId": "string"
      }
order: 8000
