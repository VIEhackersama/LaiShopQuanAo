$kind: http-example
name: Problem Details; inspect code, detail, traceId and optional fieldErrors.
request:
  url: "{{baseUrl}}/api/v1/search/ai/conversations/:id"
  method: GET
  headers:
    Accept: application/problem+json
  pathVariables:
    - key: id
      value: bfa566a4-8fff-a744-938c-fcb6123efdff
      disabled: false
      description: "(Required) "
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "code": "string",
        "detail": "string",
        "status": 8553,
        "traceId": "string"
      }
order: 3000
