$kind: http-example
name: Problem Details; inspect code, detail, traceId and optional fieldErrors.
request:
  url: "{{baseUrl}}/api/v1/search/image"
  method: POST
  headers:
    Accept: application/problem+json
  body:
    type: formdata
    content:
      - type: file
        key: file
        src: ""
        description: "(Required) "
      - type: text
        key: options
        value: '{"conditions":{"categoryId":4865,"sizes":["string","string","string","string","string","str","strin","string","stri","string","stri","strin","string","s","string","str","string","string","string",""],"colors":["string","string","st","string","string","string","string","string","string","string","string","st","string","string","string","string","string","string","string","s"],"minPrice":6807.8098725527525,"maxPrice":8918.09432534501,"sort":"PRICE_DESC"},"region":{"x":0.4613459606189281,"y":0.3216810824815184,"width":0.3386260538827628,"height":0.13736977195367217}}'
        description: "(Required) "
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "code": "string",
        "detail": "string",
        "status": 8553,
        "traceId": "string"
      }
order: 4000
