$kind: http-example
name: Problem Details; inspect code, detail, traceId and optional fieldErrors.
request:
  url: "{{baseUrl}}/api/v1/search/voice"
  method: POST
  headers:
    Accept: application/problem+json
  body:
    type: formdata
    content:
      - type: file
        key: file
        src: ""
        description: "(Required) "
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "code": "string",
        "detail": "string",
        "status": 8553,
        "traceId": "string"
      }
order: 8000
