$kind: http-example
name: Problem Details; inspect code, detail, traceId and optional fieldErrors.
request:
  url: "{{baseUrl}}/api/v1/cart/items"
  method: POST
  headers:
    Accept: application/problem+json
  body:
    type: json
    content: |-
      {
        "variantId": 1808,
        "quantity": 6059
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "code": "string",
        "detail": "string",
        "status": 8553,
        "traceId": "string"
      }
order: 2000
