$kind: http-example
name: Problem Details; inspect code, detail, traceId and optional fieldErrors.
request:
  url: "{{baseUrl}}/api/v1/cart/items/:id"
  method: PATCH
  headers:
    Accept: application/problem+json
  pathVariables:
    - key: id
      value: "1464"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "quantity": 7174
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "code": "string",
        "detail": "string",
        "status": 8553,
        "traceId": "string"
      }
order: 2000
