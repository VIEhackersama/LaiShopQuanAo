spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/laishop}
    username: ${DATABASE_USER:laishop}
    password: ${DATABASE_PASSWORD}
    hikari:
      data-source-properties:
        reWriteBatchedInserts: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      initialize-schema: never
    timeout: 2h
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
app:
  media-root: ${MEDIA_ROOT:./media}
  bank:
    name: ${BANK_NAME:}
    account: ${BANK_ACCOUNT:}
    holder: ${BANK_HOLDER:}
springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs
