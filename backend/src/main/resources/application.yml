spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/laishop}
    username: ${DATABASE_USER:laishop}
    password: ${DATABASE_PASSWORD}
    hikari:
      data-source-properties:
        reWriteBatchedInserts: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      initialize-schema: never
    timeout: 2h
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
app:
  ai:
    enabled: ${AI_ENABLED:false}
    ollama-url: ${AI_OLLAMA_URL:http://127.0.0.1:11434}
    model: ${AI_MODEL:qwen3:8b}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
  media-root: ${MEDIA_ROOT:./media}
  search:
    speech:
      service-url: ${SPEECH_SERVICE_URL:http://clip-service:8001}
      connect-timeout-seconds: ${SPEECH_CONNECT_TIMEOUT_SECONDS:3}
      request-timeout-seconds: ${SPEECH_REQUEST_TIMEOUT_SECONDS:15}
      fallback-on-error: ${SPEECH_FALLBACK_ON_ERROR:true}
      fallback-text: ${SPEECH_FALLBACK_TEXT:Áo thun Everyday}
    openai:
      voice:
        enabled: ${OPENAI_VOICE_ENABLED:false}
        api-key: ${OPENAI_API_KEY:}
        model: ${OPENAI_TRANSCRIBE_MODEL:gpt-transcribe}
        language: ${OPENAI_TRANSCRIBE_LANGUAGE:vi}
        base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
        connect-timeout-seconds: ${OPENAI_CONNECT_TIMEOUT_SECONDS:5}
        request-timeout-seconds: ${OPENAI_REQUEST_TIMEOUT_SECONDS:30}
  bank:
    name: ${BANK_NAME:}
    account: ${BANK_ACCOUNT:}
    holder: ${BANK_HOLDER:}
springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs
